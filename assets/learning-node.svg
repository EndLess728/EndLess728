<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="820" height="330" viewBox="0 0 820 330" role="img" aria-label="Terminal: what Mantu is learning — Node.js, Express, REST APIs, MongoDB">
  <style>
    .t   { font: 400 15px ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; fill: #d6d4ee; white-space: pre; }
    .p   { fill: #fe428e; font-weight: 700; }
    .k   { fill: #bb9af7; }
    .s   { fill: #9ece6a; }
    .key { fill: #7dcfff; }
