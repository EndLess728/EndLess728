  </style>

  <rect x="1" y="1" width="818" height="328" rx="12" fill="#141321" stroke="#2a2840" stroke-width="2"/>
  <path d="M1 13 a12 12 0 0 1 12 -12 h794 a12 12 0 0 1 12 12 v27 h-818 z" fill="#1e1c30"/>
