    .l1{animation-delay:.3s}.l2{animation-delay:1.0s}.l3{animation-delay:1.3s}.l4{animation-delay:1.6s}
    .l5{animation-delay:1.9s}.l6{animation-delay:2.2s}.l7{animation-delay:2.5s}.l8{animation-delay:2.8s}
    .l9{animation-delay:3.6s}.l10{animation-delay:4.4s}.l11{animation-delay:4.8s}
    .cur { animation: blink 1s steps(1) infinite; }
